  <rect x="175.65" y="1038.62" width="84.68" height="28.56" rx="3" fill="#f1f3f6"/>
  <text x="181.27" y="1059.53" font-size="20.4" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">--zoom</text>
  <rect x="371.01" y="1038.62" width="47.96" height="28.56" rx="3" fill="#f1f3f6"/>
  <text x="376.63" y="1059.53" font-size="20.4" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">150</text>
  <line x1="32" y1="1077.57" x2="443.46" y2="1077.57" stroke="#d8dee4" stroke-width="1"/>
  <text x="32" y="1145.37" font-size="36" fill="#05503d" xml:space="preserve" font-weight="bold">配合位图格式</text>
  <line x1="32" y1="1170.57" x2="718" y2="1170.57" stroke="#d8dee4" stroke-width="1"/>
  <text x="32" y="1217.97" font-size="24" fill="#1f2328" xml:space="preserve">如果目标平台不接受 SVG，改成无损 WebP：</text>
  <rect x="32" y="1253.97" width="686" height="105.2" rx="6" fill="#f1f3f6"/>
  <text x="665.68" y="1272.41" font-size="16.8" fill="#5b636c" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">bash</text>
  <text x="44" y="1309.39" font-size="20.4" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">markpop README.md --canvas mobile --zoom 150 -f webp </text>
  <text x="44" y="1339.99" font-size="20.4" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">-o share.webp</text>
  <text x="32" y="1426.97" font-size="36" fill="#05503d" xml:space="preserve" font-weight="bold">清单</text>
