<svg xmlns="http://www.w3.org/2000/svg" role="img" width="750" height="1664.77" viewBox="0 0 750 1664.77" font-family="Segoe UI, -apple-system, Helvetica, Arial, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="750" height="1664.77" fill="#ffffff"/>
  <text x="32" y="77.6" font-size="48" fill="#05503d" xml:space="preserve" font-weight="bold">速查卡：把 README 做成图</text>
  <text x="32" y="140" font-size="48" fill="#05503d" xml:space="preserve" font-weight="bold">片</text>
  <line x1="32" y1="173.6" x2="718" y2="173.6" stroke="#d8dee4" stroke-width="2"/>
  <text x="32" y="221" font-size="24" fill="#1f2328" xml:space="preserve" font-weight="bold">目标</text>
  <text x="80.96" y="221" font-size="24" fill="#1f2328" xml:space="preserve">：一张可以在社交平台和聊天里直接转发的长图</text>
  <text x="32" y="277.4" font-size="24" fill="#1f2328" xml:space="preserve">README 截图通常有 800 px 宽，在手机上根本看不清。这张</text>
  <text x="32" y="315.8" font-size="24" fill="#1f2328" xml:space="preserve">速查卡说明怎么用手机宽度 渲染同一份文档，并放大正文。</text>
  <rect x="32" y="351.8" width="686" height="74.6" rx="6" fill="#f1f3f6"/>
  <text x="665.68" y="370.24" font-size="16.8" fill="#5b636c" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">bash</text>
  <text x="44" y="407.22" font-size="20.4" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">markpop README.md --canvas mobile -o share.svg</text>
  <text x="32" y="494.2" font-size="36" fill="#05503d" xml:space="preserve" font-weight="bold">会得到什么</text>
  <line x1="32" y1="519.4" x2="718" y2="519.4" stroke="#d8dee4" stroke-width="1"/>
  <rect x="46.16" y="554.56" width="7.68" height="7.68" rx="3.84" fill="#33383f"/>
  <text x="68" y="572.8" font-size="24" fill="#1f2328" xml:space="preserve">宽度 750 px 的连续长图，不分页</text>
  <rect x="46.16" y="592.96" width="7.68" height="7.68" rx="3.84" fill="#33383f"/>
  <text x="68" y="611.2" font-size="24" fill="#1f2328" xml:space="preserve">正文字号 24 px，而不是默认的 16 px</text>
  <rect x="46.16" y="631.36" width="7.68" height="7.68" rx="3.84" fill="#33383f"/>
  <text x="68" y="649.6" font-size="24" fill="#1f2328" xml:space="preserve">内边距 32 px，而不是默认的 48 px</text>
  <text x="32" y="729.4" font-size="36" fill="#05503d" xml:space="preserve" font-weight="bold">调参</text>
  <line x1="32" y1="754.6" x2="718" y2="754.6" stroke="#d8dee4" stroke-width="1"/>
  <rect x="32" y="781.6" width="411.46" height="49.33" fill="#f2f4f7"/>
