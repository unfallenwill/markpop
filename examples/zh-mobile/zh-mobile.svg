  <text x="42" y="1010.2" font-size="22.08" fill="#1f2328" xml:space="preserve">深色背景</text>
  <rect x="175.65" y="989.3" width="96.92" height="28.56" rx="3" fill="#f1f3f6"/>
  <text x="181.27" y="1010.2" font-size="20.4" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">--theme</text>
  <rect x="371.01" y="989.3" width="60.2" height="28.56" rx="3" fill="#f1f3f6"/>
