  <rect x="175.65" y="939.97" width="170.36" height="28.56" rx="3" fill="#f1f3f6"/>
  <text x="181.27" y="960.87" font-size="20.4" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">--line-height</text>
