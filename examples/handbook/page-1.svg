<svg xmlns="http://www.w3.org/2000/svg" role="img" width="794" height="1123" viewBox="0 0 794 1123" font-family="Segoe UI, -apple-system, Helvetica, Arial, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="794" height="1123" fill="#ffffff"/>
  <text x="56" y="86.4" font-size="32" fill="#05503d" xml:space="preserve" font-weight="bold">Operations Handbook</text>
  <line x1="56" y1="108.8" x2="738" y2="108.8" stroke="#d8dee4" stroke-width="2"/>
  <text x="56" y="141.4" font-size="16" fill="#1f2328" xml:space="preserve" font-weight="bold">Audience:</text>
  <text x="131.72" y="141.4" font-size="16" fill="#1f2328" xml:space="preserve"> on-call engineers</text>
  <text x="270.92" y="141.4" font-size="16" fill="#1f2328" xml:space="preserve" font-weight="bold">Revision:</text>
  <text x="340.45" y="141.4" font-size="16" fill="#1f2328" xml:space="preserve"> 2026-10-01</text>
  <text x="56" y="179" font-size="16" fill="#1f2328" xml:space="preserve">This handbook covers the runbook for the deployment pipeline, the alert catalogue,</text>
  <text x="56" y="204.6" font-size="16" fill="#1f2328" xml:space="preserve">and the escalation path. It is written to be rendered to A4 and printed, so sections are</text>
  <text x="56" y="230.2" font-size="16" fill="#1f2328" xml:space="preserve">numbered and tables are kept narrow.</text>
  <text x="56" y="283.4" font-size="24" fill="#05503d" xml:space="preserve" font-weight="bold">1. Deployment pipeline</text>
  <line x1="56" y1="300.2" x2="738" y2="300.2" stroke="#d8dee4" stroke-width="1"/>
  <text x="56" y="332.8" font-size="16" fill="#1f2328" xml:space="preserve">Every merge to</text>
  <rect x="179.38" y="318.48" width="39.8" height="19.04" rx="3" fill="#f1f3f6"/>
  <text x="182.96" y="332.8" font-size="13.6" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">main</text>
  <text x="219.68" y="332.8" font-size="16" fill="#1f2328" xml:space="preserve"> triggers the pipeline below. No stage may be skipped without an</text>
  <text x="56" y="358.4" font-size="16" fill="#1f2328" xml:space="preserve">incident record.</text>
  <rect x="56" y="382.4" width="398.15" height="37.55" fill="#f2f4f7"/>
  <text x="66" y="405.59" font-size="14.72" fill="#1f2328" xml:space="preserve" font-weight="bold">Stage</text>
  <text x="186.42" y="405.59" font-size="14.72" fill="#1f2328" xml:space="preserve" font-weight="bold">Timeout</text>
  <text x="268.51" y="405.59" font-size="14.72" fill="#1f2328" xml:space="preserve" font-weight="bold">On failure</text>
  <line x1="56" y1="382.4" x2="454.15" y2="382.4" stroke="#d8dee4" stroke-width="1"/>
  <line x1="56" y1="419.95" x2="454.15" y2="419.95" stroke="#d8dee4" stroke-width="1"/>
  <rect x="66.5" y="429.21" width="47.96" height="19.04" rx="3" fill="#f1f3f6"/>
  <text x="70.08" y="443.14" font-size="13.6" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">build</text>
  <text x="186.42" y="443.14" font-size="14.72" fill="#1f2328" xml:space="preserve">10 min</text>
  <text x="268.51" y="443.14" font-size="14.72" fill="#1f2328" xml:space="preserve">retry once, then page</text>
  <line x1="56" y1="457.5" x2="454.15" y2="457.5" stroke="#d8dee4" stroke-width="1"/>
  <rect x="66.5" y="466.76" width="96.92" height="19.04" rx="3" fill="#f1f3f6"/>
  <text x="70.08" y="480.7" font-size="13.6" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">integration</text>
  <text x="186.42" y="480.7" font-size="14.72" fill="#1f2328" xml:space="preserve">20 min</text>
  <text x="268.51" y="480.7" font-size="14.72" fill="#1f2328" xml:space="preserve">retry twice, then page</text>
  <line x1="56" y1="495.06" x2="454.15" y2="495.06" stroke="#d8dee4" stroke-width="1"/>
  <rect x="66.5" y="504.31" width="56.12" height="19.04" rx="3" fill="#f1f3f6"/>
  <text x="70.08" y="518.25" font-size="13.6" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">canary</text>
  <text x="186.42" y="518.25" font-size="14.72" fill="#1f2328" xml:space="preserve">30 min</text>
  <text x="268.51" y="518.25" font-size="14.72" fill="#1f2328" xml:space="preserve">auto-rollback, then page</text>
  <line x1="56" y1="532.61" x2="454.15" y2="532.61" stroke="#d8dee4" stroke-width="1"/>
  <rect x="66.5" y="541.86" width="64.28" height="19.04" rx="3" fill="#f1f3f6"/>
  <text x="70.08" y="555.8" font-size="13.6" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">promote</text>
  <text x="186.42" y="555.8" font-size="14.72" fill="#1f2328" xml:space="preserve">10 min</text>
  <text x="268.51" y="555.8" font-size="14.72" fill="#1f2328" xml:space="preserve">auto-rollback, then page</text>
  <line x1="56" y1="570.16" x2="454.15" y2="570.16" stroke="#d8dee4" stroke-width="1"/>
  <text x="56" y="608.36" font-size="20" fill="#05503d" xml:space="preserve" font-weight="bold">1.1 Running it locally</text>
  <rect x="56" y="631.36" width="682" height="78.8" rx="6" fill="#f1f3f6"/>
  <text x="699.12" y="645.32" font-size="11.2" fill="#5b636c" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">bash</text>
  <text x="68" y="673.64" font-size="13.6" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">cargo run --release -- pipeline.toml --dry-run</text>
  <text x="68" y="694.04" font-size="13.6" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">cargo run --release -- pipeline.toml --stage integration</text>
  <text x="56" y="743.76" font-size="16" fill="#1f2328" xml:space="preserve">The dry run prints the resolved plan without contacting the cluster.</text>
  <text x="56" y="789.96" font-size="20" fill="#05503d" xml:space="preserve" font-weight="bold">1.2 Canary rules</text>
  <text x="56" y="826.56" font-size="16" fill="#1f2328" xml:space="preserve">The canary receives 5% of traffic for ten minutes. It is promoted automatically when</text>
  <text x="56" y="852.16" font-size="16" fill="#1f2328" xml:space="preserve">all three of the following hold:</text>
  <rect x="65.44" y="881.6" width="5.12" height="5.12" rx="2.56" fill="#33383f"/>
  <text x="80" y="893.76" font-size="16" fill="#1f2328" xml:space="preserve">error rate stays below 0.1%;</text>
  <rect x="65.44" y="907.2" width="5.12" height="5.12" rx="2.56" fill="#33383f"/>
  <text x="80" y="919.36" font-size="16" fill="#1f2328" xml:space="preserve">p99 latency stays below 250 ms;</text>
  <rect x="65.44" y="932.8" width="5.12" height="5.12" rx="2.56" fill="#33383f"/>
  <text x="80" y="944.96" font-size="16" fill="#1f2328" xml:space="preserve">the saturation counter reports no new criticals.</text>
  <text x="56" y="986.56" font-size="16" fill="#1f2328" xml:space="preserve">If any condition fails, the deployment rolls back to the previous revision and the on-call</text>
  <text x="56" y="1012.16" font-size="16" fill="#1f2328" xml:space="preserve">engineer is notified.</text>
</svg>
