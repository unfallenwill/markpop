<svg xmlns="http://www.w3.org/2000/svg" role="img" width="800" height="1049.3" viewBox="0 0 800 1049.3" font-family="Segoe UI, -apple-system, Helvetica, Arial, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="800" height="1049.3" fill="#0d1117"/>
  <rect x="48.5" y="59.28" width="129.56" height="19.04" rx="3" fill="#161b22"/>
  <text x="52.08" y="78.4" font-size="13.6" fill="#dbdfe4" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">markpop::render</text>
  <line x1="48" y1="100.8" x2="752" y2="100.8" stroke="#2d333b" stroke-width="2"/>
  <text x="48" y="133.4" font-size="16" fill="#e6edf3" xml:space="preserve">把一份 Markdown 文档渲染成 SVG 字符串。</text>
  <text x="48" y="186.6" font-size="24" fill="#eaf3f0" xml:space="preserve" font-weight="bold">函数签名</text>
  <line x1="48" y1="203.4" x2="752" y2="203.4" stroke="#2d333b" stroke-width="1"/>
  <rect x="48" y="222.4" width="704" height="58.4" rx="6" fill="#161b22"/>
  <text x="713.12" y="236.36" font-size="11.2" fill="#8b949e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">rust</text>
  <text x="60" y="264.68" font-size="13.6" fill="#dbdfe4" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">pub fn render(markdown: &amp;str) -&gt; String</text>
  <text x="48" y="314.4" font-size="16" fill="#e6edf3" xml:space="preserve">使用默认主题（</text>
  <rect x="160.5" y="300.08" width="121.4" height="19.04" rx="3" fill="#161b22"/>
  <text x="164.08" y="314.4" font-size="13.6" fill="#dbdfe4" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">Theme::light()</text>
  <text x="282.4" y="314.4" font-size="16" fill="#e6edf3" xml:space="preserve">）、100% 缩放渲染。</text>
  <text x="48" y="367.6" font-size="24" fill="#eaf3f0" xml:space="preserve" font-weight="bold">参数</text>
  <line x1="48" y1="384.4" x2="752" y2="384.4" stroke="#2d333b" stroke-width="1"/>
  <rect x="48" y="403.4" width="553.58" height="37.55" fill="#161b22"/>
  <text x="58" y="426.59" font-size="14.72" fill="#e6edf3" xml:space="preserve" font-weight="bold">参数</text>
  <text x="153.44" y="426.59" font-size="14.72" fill="#e6edf3" xml:space="preserve" font-weight="bold">类型</text>
  <text x="215.57" y="426.59" font-size="14.72" fill="#e6edf3" xml:space="preserve" font-weight="bold">说明</text>
  <line x1="48" y1="403.4" x2="601.58" y2="403.4" stroke="#2d333b" stroke-width="1"/>
  <line x1="48" y1="440.95" x2="601.58" y2="440.95" stroke="#2d333b" stroke-width="1"/>
  <rect x="58.5" y="450.21" width="72.44" height="19.04" rx="3" fill="#161b22"/>
  <text x="62.08" y="464.14" font-size="13.6" fill="#dbdfe4" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">markdown</text>
  <rect x="153.94" y="450.21" width="39.8" height="19.04" rx="3" fill="#161b22"/>
  <text x="157.52" y="464.14" font-size="13.6" fill="#dbdfe4" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">&amp;str</text>
  <text x="215.57" y="464.14" font-size="14.72" fill="#e6edf3" xml:space="preserve">文档源码。无法识别的输入会降级为文本，而不是报错。</text>
  <line x1="48" y1="478.5" x2="601.58" y2="478.5" stroke="#2d333b" stroke-width="1"/>
  <text x="48" y="523.7" font-size="24" fill="#eaf3f0" xml:space="preserve" font-weight="bold">返回值</text>
  <line x1="48" y1="540.5" x2="752" y2="540.5" stroke="#2d333b" stroke-width="1"/>
  <text x="48" y="573.1" font-size="16" fill="#e6edf3" xml:space="preserve">SVG 文档字符串。标记是纯正的 SVG 1.1：只有</text>
  <rect x="395.06" y="558.78" width="47.96" height="19.04" rx="3" fill="#161b22"/>
  <text x="398.64" y="573.1" font-size="13.6" fill="#dbdfe4" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">&lt;svg&gt;</text>
  <text x="443.52" y="573.1" font-size="16" fill="#e6edf3" xml:space="preserve">、</text>
  <rect x="460.02" y="558.78" width="56.12" height="19.04" rx="3" fill="#161b22"/>
  <text x="463.6" y="573.1" font-size="13.6" fill="#dbdfe4" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">&lt;rect&gt;</text>
  <text x="516.64" y="573.1" font-size="16" fill="#e6edf3" xml:space="preserve">、</text>
  <rect x="533.14" y="558.78" width="56.12" height="19.04" rx="3" fill="#161b22"/>
  <text x="536.72" y="573.1" font-size="13.6" fill="#dbdfe4" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">&lt;line&gt;</text>
  <text x="589.76" y="573.1" font-size="16" fill="#e6edf3" xml:space="preserve"> 和</text>
  <rect x="615.22" y="558.78" width="56.12" height="19.04" rx="3" fill="#161b22"/>
  <text x="618.8" y="573.1" font-size="13.6" fill="#dbdfe4" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">&lt;text&gt;</text>
  <text x="671.84" y="573.1" font-size="16" fill="#e6edf3" xml:space="preserve">，没有</text>
  <text x="48" y="598.7" font-size="16" fill="#e6edf3" xml:space="preserve">CSS、没有滤镜、没有</text>
  <rect x="213.62" y="584.38" width="129.56" height="19.04" rx="3" fill="#161b22"/>
  <text x="217.2" y="598.7" font-size="13.6" fill="#dbdfe4" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">&lt;foreignObject&gt;</text>
  <text x="343.68" y="598.7" font-size="16" fill="#e6edf3" xml:space="preserve">、没有任何外部引用。</text>
  <text x="48" y="651.9" font-size="24" fill="#eaf3f0" xml:space="preserve" font-weight="bold">示例</text>
  <line x1="48" y1="668.7" x2="752" y2="668.7" stroke="#2d333b" stroke-width="1"/>
  <rect x="48" y="687.7" width="704" height="78.8" rx="6" fill="#161b22"/>
  <text x="713.12" y="701.66" font-size="11.2" fill="#8b949e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">rust</text>
  <text x="60" y="729.98" font-size="13.6" fill="#dbdfe4" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">let svg = markpop::render(&quot;# 你好\n\n世界&quot;);</text>
  <text x="60" y="750.38" font-size="13.6" fill="#dbdfe4" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">assert!(svg.starts_with(&quot;&lt;svg&quot;));</text>
  <text x="48" y="811.7" font-size="24" fill="#eaf3f0" xml:space="preserve" font-weight="bold">错误</text>
  <line x1="48" y1="828.5" x2="752" y2="828.5" stroke="#2d333b" stroke-width="1"/>
  <text x="48" y="861.1" font-size="16" fill="#e6edf3" xml:space="preserve">该函数不会失败。解析是全函数：任何字节序列都能得到一个文档。</text>
  <text x="48" y="914.3" font-size="24" fill="#eaf3f0" xml:space="preserve" font-weight="bold">相关接口</text>
  <line x1="48" y1="931.1" x2="752" y2="931.1" stroke="#2d333b" stroke-width="1"/>
  <rect x="57.44" y="955.54" width="5.12" height="5.12" rx="2.56" fill="#b6bdc5"/>
  <rect x="72.5" y="953.38" width="96.92" height="19.04" rx="3" fill="#161b22"/>
  <text x="76.08" y="967.7" font-size="13.6" fill="#dbdfe4" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">render_with</text>
  <text x="169.92" y="967.7" font-size="16" fill="#e6edf3" xml:space="preserve">：控制主题、缩放、画布和输出格式</text>
  <rect x="57.44" y="981.14" width="5.12" height="5.12" rx="2.56" fill="#b6bdc5"/>
  <rect x="72.5" y="978.98" width="72.44" height="19.04" rx="3" fill="#161b22"/>
  <text x="76.08" y="993.3" font-size="13.6" fill="#dbdfe4" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">to_scene</text>
  <text x="145.44" y="993.3" font-size="16" fill="#e6edf3" xml:space="preserve">：只取几何信息，不做序列化</text>
</svg>
