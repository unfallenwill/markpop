<svg xmlns="http://www.w3.org/2000/svg" role="img" width="800" height="1287.8" viewBox="0 0 800 1287.8" font-family="Segoe UI, -apple-system, Helvetica, Arial, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="800" height="1287.8" fill="#ffffff"/>
  <text x="48" y="78.4" font-size="32" fill="#05503d" xml:space="preserve" font-weight="bold">The Cost of a</text>
  <text x="48" y="120" font-size="32" fill="#05503d" xml:space="preserve" font-weight="bold">Screenshot</text>
  <line x1="48" y1="142.4" x2="386" y2="142.4" stroke="#d8dee4" stroke-width="2"/>
  <text x="48" y="175" font-size="16" fill="#1f2328" xml:space="preserve" font-style="italic">Notes on rendering, fidelity, and the quiet</text>
  <text x="48" y="200.6" font-size="16" fill="#1f2328" xml:space="preserve" font-style="italic">virtues of files you can still edit.</text>
  <text x="48" y="238.2" font-size="16" fill="#1f2328" xml:space="preserve">A screenshot is a claim that the document</text>
  <text x="48" y="263.8" font-size="16" fill="#1f2328" xml:space="preserve">ended there. It flattens a structure —</text>
  <text x="48" y="289.4" font-size="16" fill="#1f2328" xml:space="preserve">headings, lists, quotes — into a rectangle</text>
  <text x="48" y="315" font-size="16" fill="#1f2328" xml:space="preserve">of ink, and asks the reader to trust that</text>
  <text x="48" y="340.6" font-size="16" fill="#1f2328" xml:space="preserve">nothing was cut off, nothing was</text>
  <text x="48" y="366.2" font-size="16" fill="#1f2328" xml:space="preserve">reflowed, and nothing was lost in the</text>
  <text x="48" y="391.8" font-size="16" fill="#1f2328" xml:space="preserve">transfer.</text>
  <text x="48" y="445" font-size="24" fill="#05503d" xml:space="preserve" font-weight="bold">Flattening</text>
  <line x1="48" y1="461.8" x2="386" y2="461.8" stroke="#d8dee4" stroke-width="1"/>
  <text x="48" y="494.4" font-size="16" fill="#1f2328" xml:space="preserve">Flattening is not inherently bad. For a</text>
  <text x="48" y="520" font-size="16" fill="#1f2328" xml:space="preserve">thumbnail, or a preview in a feed, it is</text>
  <text x="48" y="545.6" font-size="16" fill="#1f2328" xml:space="preserve">exactly right. The trouble starts when the</text>
  <text x="48" y="571.2" font-size="16" fill="#1f2328" xml:space="preserve">flattened artifact becomes the only</text>
  <text x="48" y="596.8" font-size="16" fill="#1f2328" xml:space="preserve">artifact.</text>
  <text x="48" y="634.4" font-size="16" fill="#1f2328" xml:space="preserve">Once text is pixels, three things follow. It</text>
  <text x="48" y="660" font-size="16" fill="#1f2328" xml:space="preserve">can no longer be searched. It can no longer</text>
  <text x="48" y="685.6" font-size="16" fill="#1f2328" xml:space="preserve">be reflowed, so a narrow screen either</text>
  <text x="48" y="711.2" font-size="16" fill="#1f2328" xml:space="preserve">scrolls forever or crops. And it can no</text>
  <text x="48" y="736.8" font-size="16" fill="#1f2328" xml:space="preserve">longer be restyled, so a change of brand</text>
  <text x="48" y="762.4" font-size="16" fill="#1f2328" xml:space="preserve">means rendering every page again.</text>
  <text x="48" y="815.6" font-size="24" fill="#05503d" xml:space="preserve" font-weight="bold">The alternative</text>
  <line x1="48" y1="832.4" x2="386" y2="832.4" stroke="#d8dee4" stroke-width="1"/>
  <text x="48" y="865" font-size="16" fill="#1f2328" xml:space="preserve">The alternative is not a faster screenshot.</text>
  <text x="48" y="890.6" font-size="16" fill="#1f2328" xml:space="preserve">It is a document that was never a picture</text>
  <text x="48" y="916.2" font-size="16" fill="#1f2328" xml:space="preserve">to begin with.</text>
  <rect x="48" y="940.2" width="338" height="78.8" rx="6" fill="#f1f3f6"/>
  <text x="347.12" y="954.16" font-size="11.2" fill="#5b636c" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">rust</text>
  <text x="60" y="982.48" font-size="13.6" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">let svg = markpop::render(&quot;# </text>
  <text x="60" y="1002.88" font-size="13.6" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">Hello\n\nWorld&quot;);</text>
  <text x="48" y="1052.6" font-size="16" fill="#1f2328" xml:space="preserve">That call returns a string of markup. The</text>
  <text x="48" y="1078.2" font-size="16" fill="#1f2328" xml:space="preserve">text in it is text. You can select it, search</text>
  <text x="48" y="1103.8" font-size="16" fill="#1f2328" xml:space="preserve">it, scale it to any size, or hand it to a</text>
  <text x="48" y="1129.4" font-size="16" fill="#1f2328" xml:space="preserve">different renderer entirely. The geometry</text>
  <text x="48" y="1155" font-size="16" fill="#1f2328" xml:space="preserve">lives in a flat list of primitives, which</text>
  <text x="48" y="1180.6" font-size="16" fill="#1f2328" xml:space="preserve">means the serializer is the only part that</text>
  <text x="48" y="1206.2" font-size="16" fill="#1f2328" xml:space="preserve">has an opinion about what the output</text>
  <text x="48" y="1231.8" font-size="16" fill="#1f2328" xml:space="preserve">should look like.</text>
  <rect x="414" y="48" width="338" height="67.2" fill="#f8f9fb"/>
  <rect x="414" y="48" width="4" height="67.2" fill="#d1d9e0"/>
  <text x="430" y="73.6" font-size="16" fill="#1f2328" xml:space="preserve">The document is the source of truth.</text>
  <text x="430" y="99.2" font-size="16" fill="#1f2328" xml:space="preserve">The image is one rendering of it.</text>
  <text x="414" y="160.4" font-size="24" fill="#05503d" xml:space="preserve" font-weight="bold">Two columns</text>
  <line x1="414" y1="177.2" x2="752" y2="177.2" stroke="#d8dee4" stroke-width="1"/>
  <text x="414" y="209.8" font-size="16" fill="#1f2328" xml:space="preserve">Two columns change how a document</text>
  <text x="414" y="235.4" font-size="16" fill="#1f2328" xml:space="preserve">reads. Narrow measures force shorter</text>
  <text x="414" y="261" font-size="16" fill="#1f2328" xml:space="preserve">sentences and faster paragraphs. A page</text>
  <text x="414" y="286.6" font-size="16" fill="#1f2328" xml:space="preserve">of dense prose becomes a page you can</text>
  <text x="414" y="312.2" font-size="16" fill="#1f2328" xml:space="preserve">scan.</text>
  <text x="414" y="349.8" font-size="16" fill="#1f2328" xml:space="preserve">Balanced columns share one continuous</text>
  <text x="414" y="375.4" font-size="16" fill="#1f2328" xml:space="preserve">flow: the engine finds the shortest height</text>
  <text x="414" y="401" font-size="16" fill="#1f2328" xml:space="preserve">that fits the requested number of</text>
  <text x="414" y="426.6" font-size="16" fill="#1f2328" xml:space="preserve">columns, and divides the text evenly</text>
  <text x="414" y="452.2" font-size="16" fill="#1f2328" xml:space="preserve">between them. Nothing is lost and nothing</text>
  <text x="414" y="477.8" font-size="16" fill="#1f2328" xml:space="preserve">is reordered — the reader simply reaches</text>
  <text x="414" y="503.4" font-size="16" fill="#1f2328" xml:space="preserve">the bottom of the first column slightly</text>
  <text x="414" y="529" font-size="16" fill="#1f2328" xml:space="preserve">earlier than the second.</text>
  <text x="414" y="582.2" font-size="24" fill="#05503d" xml:space="preserve" font-weight="bold">What is lost</text>
  <line x1="414" y1="599" x2="752" y2="599" stroke="#d8dee4" stroke-width="1"/>
  <text x="414" y="631.6" font-size="16" fill="#1f2328" xml:space="preserve">Honesty requires listing the losses. There</text>
  <text x="414" y="657.2" font-size="16" fill="#1f2328" xml:space="preserve">is no syntax highlighting, because a</text>
  <text x="414" y="682.8" font-size="16" fill="#1f2328" xml:space="preserve">highlighter is a separate program with its</text>
  <text x="414" y="708.4" font-size="16" fill="#1f2328" xml:space="preserve">own opinions about tokenization. There is</text>
  <text x="414" y="734" font-size="16" fill="#1f2328" xml:space="preserve">no remote image fetching, because a</text>
  <text x="414" y="759.6" font-size="16" fill="#1f2328" xml:space="preserve">renderer that reaches out to the network</text>
  <text x="414" y="785.2" font-size="16" fill="#1f2328" xml:space="preserve">is a renderer that can hang. And there is</text>
  <text x="414" y="810.8" font-size="16" fill="#1f2328" xml:space="preserve">no HTML execution, for the same reason a</text>
  <text x="414" y="836.4" font-size="16" fill="#1f2328" xml:space="preserve">document should not be able to run code</text>
  <text x="414" y="862" font-size="16" fill="#1f2328" xml:space="preserve">on the machine that displays it.</text>
  <text x="414" y="899.6" font-size="16" fill="#1f2328" xml:space="preserve">Everything else — emphasis, code, tables,</text>
  <text x="414" y="925.2" font-size="16" fill="#1f2328" xml:space="preserve">quotes, task lists, footnotes of your own</text>
  <text x="414" y="950.8" font-size="16" fill="#1f2328" xml:space="preserve">making — is there, and it is yours to</text>
  <text x="414" y="976.4" font-size="16" fill="#1f2328" xml:space="preserve">restyle.</text>
  <text x="414" y="1029.6" font-size="24" fill="#05503d" xml:space="preserve" font-weight="bold">Closing</text>
  <line x1="414" y1="1046.4" x2="752" y2="1046.4" stroke="#d8dee4" stroke-width="1"/>
  <text x="414" y="1079" font-size="16" fill="#1f2328" xml:space="preserve">The question to ask of any rendering tool</text>
  <text x="414" y="1104.6" font-size="16" fill="#1f2328" xml:space="preserve">is not how fast it is, but what it leaves</text>
  <text x="414" y="1130.2" font-size="16" fill="#1f2328" xml:space="preserve">behind. A good tool leaves the document</text>
  <text x="414" y="1155.8" font-size="16" fill="#1f2328" xml:space="preserve">intact.</text>
</svg>
