<svg xmlns="http://www.w3.org/2000/svg" role="img" width="750" height="1741.57" viewBox="0 0 750 1741.57" font-family="Segoe UI, -apple-system, Helvetica, Arial, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="750" height="1741.57" fill="#ffffff"/>
  <text x="32" y="77.6" font-size="48" fill="#05503d" xml:space="preserve" font-weight="bold">Quick Recipe: Ship a</text>
  <text x="32" y="140" font-size="48" fill="#05503d" xml:space="preserve" font-weight="bold">README Image</text>
  <line x1="32" y1="173.6" x2="718" y2="173.6" stroke="#d8dee4" stroke-width="2"/>
  <text x="32" y="221" font-size="24" fill="#1f2328" xml:space="preserve" font-weight="bold">Target:</text>
  <text x="121.6" y="221" font-size="24" fill="#1f2328" xml:space="preserve"> a shareable long image for social and chat</text>
  <text x="32" y="277.4" font-size="24" fill="#1f2328" xml:space="preserve">A README screenshot is usually 800 px wide, which is</text>
  <text x="32" y="315.8" font-size="24" fill="#1f2328" xml:space="preserve">unreadable on a phone. This recipe renders the same</text>
  <text x="32" y="354.2" font-size="24" fill="#1f2328" xml:space="preserve">document at phone width with larger body text.</text>
  <rect x="32" y="390.2" width="686" height="74.6" rx="6" fill="#f1f3f6"/>
  <text x="665.68" y="408.64" font-size="16.8" fill="#5b636c" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">bash</text>
  <text x="44" y="445.62" font-size="20.4" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">markpop README.md --canvas mobile -o share.svg</text>
  <text x="32" y="532.6" font-size="36" fill="#05503d" xml:space="preserve" font-weight="bold">What you get</text>
  <line x1="32" y1="557.8" x2="718" y2="557.8" stroke="#d8dee4" stroke-width="1"/>
  <rect x="46.16" y="592.96" width="7.68" height="7.68" rx="3.84" fill="#33383f"/>
  <text x="68" y="611.2" font-size="24" fill="#1f2328" xml:space="preserve">a 750 px wide continuous image, no pagination</text>
  <rect x="46.16" y="631.36" width="7.68" height="7.68" rx="3.84" fill="#33383f"/>
  <text x="68" y="649.6" font-size="24" fill="#1f2328" xml:space="preserve">24 px body text instead of 16 px</text>
  <rect x="46.16" y="669.76" width="7.68" height="7.68" rx="3.84" fill="#33383f"/>
  <text x="68" y="688" font-size="24" fill="#1f2328" xml:space="preserve">32 px padding instead of 48 px</text>
  <text x="32" y="767.8" font-size="36" fill="#05503d" xml:space="preserve" font-weight="bold">Tuning the output</text>
  <line x1="32" y1="793" x2="718" y2="793" stroke="#d8dee4" stroke-width="1"/>
  <rect x="32" y="820" width="486.71" height="49.33" fill="#f2f4f7"/>
  <text x="42" y="851.29" font-size="22.08" fill="#1f2328" xml:space="preserve" font-weight="bold">Goal</text>
  <text x="250.41" y="851.29" font-size="22.08" fill="#1f2328" xml:space="preserve" font-weight="bold">Flag</text>
  <text x="445.76" y="851.29" font-size="22.08" fill="#1f2328" xml:space="preserve" font-weight="bold">Value</text>
  <line x1="32" y1="820" x2="518.71" y2="820" stroke="#d8dee4" stroke-width="1"/>
  <line x1="32" y1="869.33" x2="518.71" y2="869.33" stroke="#d8dee4" stroke-width="1"/>
  <text x="42" y="900.62" font-size="22.08" fill="#1f2328" xml:space="preserve">Wider canvas</text>
  <rect x="250.91" y="879.71" width="96.92" height="28.56" rx="3" fill="#f1f3f6"/>
  <text x="256.53" y="900.62" font-size="20.4" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">--width</text>
  <rect x="446.26" y="879.71" width="47.96" height="28.56" rx="3" fill="#f1f3f6"/>
  <text x="451.88" y="900.62" font-size="20.4" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">800</text>
  <line x1="32" y1="918.66" x2="518.71" y2="918.66" stroke="#d8dee4" stroke-width="1"/>
  <text x="42" y="949.94" font-size="22.08" fill="#1f2328" xml:space="preserve">Bigger text</text>
  <rect x="250.91" y="929.04" width="145.88" height="28.56" rx="3" fill="#f1f3f6"/>
  <text x="256.53" y="949.94" font-size="20.4" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">--font-size</text>
  <rect x="446.26" y="929.04" width="35.72" height="28.56" rx="3" fill="#f1f3f6"/>
  <text x="451.88" y="949.94" font-size="20.4" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">26</text>
  <line x1="32" y1="967.98" x2="518.71" y2="967.98" stroke="#d8dee4" stroke-width="1"/>
  <text x="42" y="999.27" font-size="22.08" fill="#1f2328" xml:space="preserve">Looser leading</text>
  <rect x="250.91" y="978.37" width="170.36" height="28.56" rx="3" fill="#f1f3f6"/>
  <text x="256.53" y="999.27" font-size="20.4" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">--line-height</text>
  <rect x="446.26" y="978.37" width="47.96" height="28.56" rx="3" fill="#f1f3f6"/>
  <text x="451.88" y="999.27" font-size="20.4" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">1.7</text>
  <line x1="32" y1="1017.31" x2="518.71" y2="1017.31" stroke="#d8dee4" stroke-width="1"/>
  <text x="42" y="1048.6" font-size="22.08" fill="#1f2328" xml:space="preserve">Dark background</text>
  <rect x="250.91" y="1027.7" width="96.92" height="28.56" rx="3" fill="#f1f3f6"/>
  <text x="256.53" y="1048.6" font-size="20.4" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">--theme</text>
  <rect x="446.26" y="1027.7" width="60.2" height="28.56" rx="3" fill="#f1f3f6"/>
  <text x="451.88" y="1048.6" font-size="20.4" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">dark</text>
  <line x1="32" y1="1066.64" x2="518.71" y2="1066.64" stroke="#d8dee4" stroke-width="1"/>
  <text x="42" y="1097.93" font-size="22.08" fill="#1f2328" xml:space="preserve">Higher resolution</text>
  <rect x="250.91" y="1077.02" width="84.68" height="28.56" rx="3" fill="#f1f3f6"/>
  <text x="256.53" y="1097.93" font-size="20.4" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">--zoom</text>
  <rect x="446.26" y="1077.02" width="47.96" height="28.56" rx="3" fill="#f1f3f6"/>
  <text x="451.88" y="1097.93" font-size="20.4" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">150</text>
  <line x1="32" y1="1115.97" x2="518.71" y2="1115.97" stroke="#d8dee4" stroke-width="1"/>
  <text x="32" y="1183.77" font-size="36" fill="#05503d" xml:space="preserve" font-weight="bold">Combine with a raster format</text>
  <line x1="32" y1="1208.97" x2="718" y2="1208.97" stroke="#d8dee4" stroke-width="1"/>
  <text x="32" y="1256.37" font-size="24" fill="#1f2328" xml:space="preserve">If the destination does not accept SVG, produce a lossless</text>
  <text x="32" y="1294.77" font-size="24" fill="#1f2328" xml:space="preserve">WebP instead:</text>
  <rect x="32" y="1330.77" width="686" height="105.2" rx="6" fill="#f1f3f6"/>
  <text x="665.68" y="1349.21" font-size="16.8" fill="#5b636c" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">bash</text>
  <text x="44" y="1386.19" font-size="20.4" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">markpop README.md --canvas mobile --zoom 150 -f webp </text>
  <text x="44" y="1416.79" font-size="20.4" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">-o share.webp</text>
  <text x="32" y="1503.77" font-size="36" fill="#05503d" xml:space="preserve" font-weight="bold">Checklist</text>
  <line x1="32" y1="1528.97" x2="718" y2="1528.97" stroke="#d8dee4" stroke-width="1"/>
  <rect x="39.5" y="1556" width="21" height="21" rx="4.32" fill="#0969da"/>
  <line x1="44.54" y1="1567.55" x2="48.74" y2="1571.75" stroke="#ffffff" stroke-width="2.4"/>
  <line x1="48.74" y1="1571.75" x2="55.88" y2="1561.88" stroke="#ffffff" stroke-width="2.4"/>
  <text x="68" y="1582.37" font-size="24" fill="#1f2328" xml:space="preserve">Render at phone width</text>
  <rect x="39.5" y="1595" width="21" height="21" rx="4.32" fill="#0969da"/>
  <line x1="44.54" y1="1606.55" x2="48.74" y2="1610.75" stroke="#ffffff" stroke-width="2.4"/>
  <line x1="48.74" y1="1610.75" x2="55.88" y2="1600.88" stroke="#ffffff" stroke-width="2.4"/>
  <text x="68" y="1620.77" font-size="24" fill="#1f2328" xml:space="preserve">Bump the body text to 24 px</text>
  <rect x="39.5" y="1633" width="21" height="21" rx="4.32" fill="#0969da"/>
  <line x1="44.54" y1="1644.55" x2="48.74" y2="1648.75" stroke="#ffffff" stroke-width="2.4"/>
  <line x1="48.74" y1="1648.75" x2="55.88" y2="1638.88" stroke="#ffffff" stroke-width="2.4"/>
  <text x="68" y="1659.17" font-size="24" fill="#1f2328" xml:space="preserve">Export lossless WebP for chat apps</text>
  <rect x="39.5" y="1672" width="21" height="21" rx="4.32" fill="none" stroke="#5b636c" stroke-width="2.16"/>
  <text x="68" y="1697.57" font-size="24" fill="#1f2328" xml:space="preserve">Add the project logo to the header</text>
</svg>
