<svg xmlns="http://www.w3.org/2000/svg" role="img" width="794" height="1123" viewBox="0 0 794 1123" font-family="Segoe UI, -apple-system, Helvetica, Arial, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="794" height="1123" fill="#ffffff"/>
  <text x="56" y="73.6" font-size="16" fill="#1f2328" xml:space="preserve" font-weight="bold">晋级已经完成了还能回滚吗？</text>
  <text x="268.16" y="73.6" font-size="16" fill="#1f2328" xml:space="preserve"> 可以。任何时候回滚都是受支持的操作，把它当作第一 响应手</text>
  <text x="56" y="99.2" font-size="16" fill="#1f2328" xml:space="preserve">段也完全合理。</text>
  <text x="56" y="136.8" font-size="16" fill="#1f2328" xml:space="preserve" font-weight="bold">如果回滚本身失败了怎么办？</text>
  <text x="268.16" y="136.8" font-size="16" fill="#1f2328" xml:space="preserve"> 立即升级，不要在自动回滚失败的基础上再叠加一次 手工回滚</text>
  <text x="56" y="162.4" font-size="16" fill="#1f2328" xml:space="preserve">。</text>
</svg>
