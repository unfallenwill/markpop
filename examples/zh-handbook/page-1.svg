<svg xmlns="http://www.w3.org/2000/svg" role="img" width="794" height="1123" viewBox="0 0 794 1123" font-family="Segoe UI, -apple-system, Helvetica, Arial, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="794" height="1123" fill="#ffffff"/>
  <text x="56" y="86.4" font-size="32" fill="#05503d" xml:space="preserve" font-weight="bold">值班手册</text>
  <line x1="56" y1="108.8" x2="738" y2="108.8" stroke="#d8dee4" stroke-width="2"/>
  <text x="56" y="141.4" font-size="16" fill="#1f2328" xml:space="preserve" font-weight="bold">适用对象</text>
  <text x="121.28" y="141.4" font-size="16" fill="#1f2328" xml:space="preserve">：值班工程师</text>
  <text x="221.76" y="141.4" font-size="16" fill="#1f2328" xml:space="preserve" font-weight="bold">修订日期</text>
  <text x="287.04" y="141.4" font-size="16" fill="#1f2328" xml:space="preserve">：2026-10-01</text>
  <text x="56" y="179" font-size="16" fill="#1f2328" xml:space="preserve">本手册覆盖发布流水线、告警目录和升级路径。手册按 A4 排版，章节编号、表格宽度都 按打</text>
  <text x="56" y="204.6" font-size="16" fill="#1f2328" xml:space="preserve">印场景做过收敛。</text>
  <text x="56" y="257.8" font-size="24" fill="#05503d" xml:space="preserve" font-weight="bold">一、发布流水线</text>
  <line x1="56" y1="274.6" x2="738" y2="274.6" stroke="#d8dee4" stroke-width="1"/>
  <text x="56" y="307.2" font-size="16" fill="#1f2328" xml:space="preserve">每次向</text>
  <rect x="108.98" y="292.88" width="39.8" height="19.04" rx="3" fill="#f1f3f6"/>
  <text x="112.56" y="307.2" font-size="13.6" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">main</text>
  <text x="149.28" y="307.2" font-size="16" fill="#1f2328" xml:space="preserve"> 合并都会触发下面的流水线。没有事故记录，任何一个阶段都不允许跳过。</text>
  <rect x="56" y="331.2" width="408.35" height="37.55" fill="#f2f4f7"/>
  <text x="66" y="354.39" font-size="14.72" fill="#1f2328" xml:space="preserve" font-weight="bold">阶段</text>
  <text x="186.42" y="354.39" font-size="14.72" fill="#1f2328" xml:space="preserve" font-weight="bold">超时</text>
  <text x="258.59" y="354.39" font-size="14.72" fill="#1f2328" xml:space="preserve" font-weight="bold">失败后动作</text>
  <line x1="56" y1="331.2" x2="464.35" y2="331.2" stroke="#d8dee4" stroke-width="1"/>
  <line x1="56" y1="368.75" x2="464.35" y2="368.75" stroke="#d8dee4" stroke-width="1"/>
  <rect x="66.5" y="378.01" width="47.96" height="19.04" rx="3" fill="#f1f3f6"/>
  <text x="70.08" y="391.94" font-size="13.6" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">build</text>
  <text x="186.42" y="391.94" font-size="14.72" fill="#1f2328" xml:space="preserve">10 分钟</text>
  <text x="258.59" y="391.94" font-size="14.72" fill="#1f2328" xml:space="preserve">重试一次，仍失败则呼叫值班</text>
  <line x1="56" y1="406.3" x2="464.35" y2="406.3" stroke="#d8dee4" stroke-width="1"/>
  <rect x="66.5" y="415.56" width="96.92" height="19.04" rx="3" fill="#f1f3f6"/>
  <text x="70.08" y="429.5" font-size="13.6" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">integration</text>
  <text x="186.42" y="429.5" font-size="14.72" fill="#1f2328" xml:space="preserve">20 分钟</text>
  <text x="258.59" y="429.5" font-size="14.72" fill="#1f2328" xml:space="preserve">重试两次，仍失败则呼叫值班</text>
  <line x1="56" y1="443.86" x2="464.35" y2="443.86" stroke="#d8dee4" stroke-width="1"/>
  <rect x="66.5" y="453.11" width="56.12" height="19.04" rx="3" fill="#f1f3f6"/>
  <text x="70.08" y="467.05" font-size="13.6" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">canary</text>
  <text x="186.42" y="467.05" font-size="14.72" fill="#1f2328" xml:space="preserve">30 分钟</text>
  <text x="258.59" y="467.05" font-size="14.72" fill="#1f2328" xml:space="preserve">自动回滚，并呼叫值班</text>
  <line x1="56" y1="481.41" x2="464.35" y2="481.41" stroke="#d8dee4" stroke-width="1"/>
  <rect x="66.5" y="490.66" width="64.28" height="19.04" rx="3" fill="#f1f3f6"/>
  <text x="70.08" y="504.6" font-size="13.6" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">promote</text>
  <text x="186.42" y="504.6" font-size="14.72" fill="#1f2328" xml:space="preserve">10 分钟</text>
  <text x="258.59" y="504.6" font-size="14.72" fill="#1f2328" xml:space="preserve">自动回滚，并呼叫值班</text>
  <line x1="56" y1="518.96" x2="464.35" y2="518.96" stroke="#d8dee4" stroke-width="1"/>
  <text x="56" y="557.16" font-size="20" fill="#05503d" xml:space="preserve" font-weight="bold">1.1 本地执行</text>
  <rect x="56" y="580.16" width="682" height="78.8" rx="6" fill="#f1f3f6"/>
  <text x="699.12" y="594.12" font-size="11.2" fill="#5b636c" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">bash</text>
  <text x="68" y="622.44" font-size="13.6" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">cargo run --release -- pipeline.toml --dry-run</text>
  <text x="68" y="642.84" font-size="13.6" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">cargo run --release -- pipeline.toml --stage integration</text>
  <rect x="56.5" y="678.24" width="80.6" height="19.04" rx="3" fill="#f1f3f6"/>
  <text x="60.08" y="692.56" font-size="13.6" fill="#24292e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">--dry-run</text>
  <text x="137.6" y="692.56" font-size="16" fill="#1f2328" xml:space="preserve"> 只打印解析后的执行计划，不会连接集群。</text>
  <text x="56" y="738.76" font-size="20" fill="#05503d" xml:space="preserve" font-weight="bold">1.2 金丝雀规则</text>
  <text x="56" y="775.36" font-size="16" fill="#1f2328" xml:space="preserve">金丝雀承接 5% 流量，持续十分钟。三个条件同时满足才会自动晋级：</text>
  <rect x="65.44" y="804.8" width="5.12" height="5.12" rx="2.56" fill="#33383f"/>
  <text x="80" y="816.96" font-size="16" fill="#1f2328" xml:space="preserve">错误率低于 0.1%；</text>
  <rect x="65.44" y="830.4" width="5.12" height="5.12" rx="2.56" fill="#33383f"/>
  <text x="80" y="842.56" font-size="16" fill="#1f2328" xml:space="preserve">p99 延迟低于 250 毫秒；</text>
  <rect x="65.44" y="856" width="5.12" height="5.12" rx="2.56" fill="#33383f"/>
  <text x="80" y="868.16" font-size="16" fill="#1f2328" xml:space="preserve">饱和度计数器没有新增严重告警。</text>
  <text x="56" y="909.76" font-size="16" fill="#1f2328" xml:space="preserve">任何一条不满足，发布立即回滚到上一个版本，并通知值班工程师。</text>
  <rect x="56" y="933.76" width="682" height="41.6" fill="#f8f9fb"/>
  <rect x="56" y="933.76" width="4" height="41.6" fill="#d1d9e0"/>
  <text x="72" y="959.36" font-size="16" fill="#1f2328" xml:space="preserve">回滚永远是安全动作。宁可先回滚再排查，也不要在原地调试。</text>
</svg>
