  <text x="309.68" y="314.4" font-size="13.6" fill="#dbdfe4" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">Theme::light()</text>
  <text x="428" y="314.4" font-size="16" fill="#e6edf3" xml:space="preserve">) at 100% zoom.</text>
  <text x="48" y="367.6" font-size="24" fill="#eaf3f0" xml:space="preserve" font-weight="bold">Parameters</text>
  <line x1="48" y1="384.4" x2="752" y2="384.4" stroke="#2d333b" stroke-width="1"/>
  <rect x="48" y="403.4" width="704" height="61.1" fill="#161b22"/>
  <text x="58" y="426.59" font-size="14.72" fill="#e6edf3" xml:space="preserve" font-weight="bold">Paramete</text>
  <text x="58" y="450.14" font-size="14.72" fill="#e6edf3" xml:space="preserve" font-weight="bold">r</text>
