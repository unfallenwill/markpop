  <text x="526.16" y="620.21" font-size="13.6" fill="#dbdfe4" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">&lt;svg&gt;</text>
  <text x="571.04" y="620.21" font-size="16" fill="#e6edf3" xml:space="preserve">,</text>
  <rect x="580.82" y="605.89" width="56.12" height="19.04" rx="3" fill="#161b22"/>
  <text x="584.4" y="620.21" font-size="13.6" fill="#dbdfe4" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">&lt;rect&gt;</text>
  <text x="637.44" y="620.21" font-size="16" fill="#e6edf3" xml:space="preserve">,</text>
  <rect x="647.22" y="605.89" width="56.12" height="19.04" rx="3" fill="#161b22"/>
  <text x="650.8" y="620.21" font-size="13.6" fill="#dbdfe4" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">&lt;line&gt;</text>
  <text x="703.84" y="620.21" font-size="16" fill="#e6edf3" xml:space="preserve"> and</text>
  <rect x="48.5" y="631.49" width="56.12" height="19.04" rx="3" fill="#161b22"/>
  <text x="52.08" y="645.81" font-size="13.6" fill="#dbdfe4" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">&lt;text&gt;</text>
  <text x="105.12" y="645.81" font-size="16" fill="#e6edf3" xml:space="preserve"> only — no CSS, no filters, no</text>
  <rect x="328.02" y="631.49" width="129.56" height="19.04" rx="3" fill="#161b22"/>
  <text x="331.6" y="645.81" font-size="13.6" fill="#dbdfe4" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">&lt;foreignObject&gt;</text>
  <text x="458.08" y="645.81" font-size="16" fill="#e6edf3" xml:space="preserve">, no external references.</text>
  <text x="48" y="699.01" font-size="24" fill="#eaf3f0" xml:space="preserve" font-weight="bold">Example</text>
  <line x1="48" y1="715.81" x2="752" y2="715.81" stroke="#2d333b" stroke-width="1"/>
  <rect x="48" y="734.81" width="704" height="78.8" rx="6" fill="#161b22"/>
  <text x="713.12" y="748.77" font-size="11.2" fill="#8b949e" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">rust</text>
  <text x="60" y="777.09" font-size="13.6" fill="#dbdfe4" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">let svg = markpop::render(&quot;# Hello\n\nWorld&quot;);</text>
  <text x="60" y="797.49" font-size="13.6" fill="#dbdfe4" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">assert!(svg.starts_with(&quot;&lt;svg&quot;));</text>
  <text x="48" y="858.81" font-size="24" fill="#eaf3f0" xml:space="preserve" font-weight="bold">Errors</text>
  <line x1="48" y1="875.61" x2="752" y2="875.61" stroke="#2d333b" stroke-width="1"/>
  <text x="48" y="908.21" font-size="16" fill="#e6edf3" xml:space="preserve">This function does not fail. Parsing is total: every byte sequence produces a document.</text>
  <text x="48" y="961.41" font-size="24" fill="#eaf3f0" xml:space="preserve" font-weight="bold">See also</text>
