<svg xmlns="http://www.w3.org/2000/svg" role="img" width="800" height="1096.41" viewBox="0 0 800 1096.41" font-family="Segoe UI, -apple-system, Helvetica, Arial, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
