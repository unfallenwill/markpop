  <text x="217.31" y="487.7" font-size="14.72" fill="#e6edf3" xml:space="preserve">The document source. Unrecognized input degrades to text rather than</text>
  <text x="217.31" y="511.25" font-size="14.72" fill="#e6edf3" xml:space="preserve">erroring.</text>
  <line x1="48" y1="525.61" x2="752" y2="525.61" stroke="#2d333b" stroke-width="1"/>
  <text x="48" y="570.81" font-size="24" fill="#eaf3f0" xml:space="preserve" font-weight="bold">Returns</text>
  <line x1="48" y1="587.61" x2="752" y2="587.61" stroke="#2d333b" stroke-width="1"/>
  <text x="48" y="620.21" font-size="16" fill="#e6edf3" xml:space="preserve">The SVG document as a</text>
  <rect x="233.78" y="605.89" width="56.12" height="19.04" rx="3" fill="#161b22"/>
  <text x="237.36" y="620.21" font-size="13.6" fill="#dbdfe4" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">String</text>
  <text x="290.4" y="620.21" font-size="16" fill="#e6edf3" xml:space="preserve">. The markup is plain SVG 1.1:</text>
