  <text x="217.31" y="426.59" font-size="14.72" fill="#e6edf3" xml:space="preserve" font-weight="bold">Description</text>
  <line x1="48" y1="403.4" x2="752" y2="403.4" stroke="#2d333b" stroke-width="1"/>
  <line x1="48" y1="464.5" x2="752" y2="464.5" stroke="#2d333b" stroke-width="1"/>
  <rect x="58.5" y="473.76" width="72.44" height="19.04" rx="3" fill="#161b22"/>
  <text x="62.08" y="487.7" font-size="13.6" fill="#dbdfe4" xml:space="preserve" font-family="Cascadia Code, Consolas, Menlo, Monaco, &apos;Courier New&apos;, monospace">markdown</text>
  <rect x="155.68" y="473.76" width="39.8" height="19.04" rx="3" fill="#161b22"/>
