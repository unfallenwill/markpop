  <line x1="48" y1="100.8" x2="752" y2="100.8" stroke="#2d333b" stroke-width="2"/>
  <text x="48" y="133.4" font-size="16" fill="#e6edf3" xml:space="preserve">Render a Markdown document to an SVG string.</text>
