[package]
name = "markdown2svg"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Render Markdown directly to SVG, PNG or lossless WebP — no browser, no dependencies"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["markdown", "svg", "png", "webp", "renderer"]
categories = ["text-processing", "visualization", "command-line-utilities"]

[dependencies]
# Intentionally empty: the whole pipeline is dependency-free and deterministic.

[profile.release]
lto = true
